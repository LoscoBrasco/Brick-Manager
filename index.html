<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brick Manager</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <header>
    <img src="logo.png" alt="Brick Manager Logo" class="logo"/>
    <h1>Brick Manager</h1>
  </header>

  <main>
    <section>
      <label for="dbFile">Carica il tuo database LEGO (.db):</label>
      <input type="file" id="dbFile" accept=".db"/>
      <button onclick="loadDB()">Carica Database</button>
    </section>

    <section id="controls" style="display:none;">
      <input type="text" id="searchInput" placeholder="Cerca pezzo per nome o ID"/>
      <button onclick="exportInventory()">Esporta inventario</button>
    </section>

    <section id="output"></section>
  </main>

  <footer>
    <p>Powered by LEGO® – Non ufficiale | Samp Style 💙🤍🖤❤️</p>
  </footer>

  <script src="sql-wasm.js"></script>
  <script src="main.js"></script>
</body>
</html>
