<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrickStore - Gestione Inventario LEGO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.0/sql-wasm.js"></script>
</head>
<body>

    <div class="container">
        <h1>BrickStore</h1>
        <p>Gestione inventario LEGO</p>

        <!-- Selezione per caricare il database -->
        <input type="file" id="loadButton" />
        
        <!-- Seleziona un pezzo dall'inventario -->
        <select id="inventorySelect"></select>

        <!-- Mostra i dati caricati -->
        <button id="saveButton">Salva Database</button>

        <div id="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
