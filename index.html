<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BrickBase - Il tuo inventario LEGO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🧱 BrickBase</h1>

  <div class="upload-section">
    <label for="dbfile">📦 Carica il tuo database SQLite:</label>
    <input type="file" id="dbfile" accept=".sqlite,.db">
  </div>

  <div id="inventory-section" class="hidden">
    <h2>🔍 Cerca un pezzo</h2>
    <input type="text" id="searchInput" placeholder="Inserisci ID o nome pezzo...">

    <table id="resultsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Colore</th>
          <th>Quantità</th>
          <th>Aggiungi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
  <script src="main.js"></script>
</body>
</html>
